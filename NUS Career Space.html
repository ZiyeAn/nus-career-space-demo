nnerHeight-pop.offsetHeight-12))+'px';pop.querySelector('.close').onclick=()=>{pop.remove();anchor.focus()};pop.querySelectorAll('[data-open-entry]').forEach(b=>b.onclick=()=>{let e=entries.find(e=>e.id===b.dataset.openEntry);pop.remove();if(e.type==='Interview'){currentInterviewId=e.id;prepStep='home';location.hash='interviews';render()}else if(e.type==='Event'){eventOnly=true;eventTopics=[];eventSingapore=false;location.hash='job-events';render()}else{selected=data.jobs.find(j=>j.company===e.company)?.id;location.hash='jobs';render()}});pop.querySelector('[data-unsave-calendar]')?.addEventListener('click',e=>{data.savedEvents=data.savedEvents.filter(id=>id!==Number(e.target.dataset.unsaveCalendar));save();pop.remove();render();toast('Removed from calendar')});pop.querySelector('.close').focus();setTimeout(()=>{function outside(e){if(!pop.isConnected){document.removeEventListener('pointerdown',outside);return}if(!pop.contains(e.target)&&!anchor.contains(e.target)){pop.remove();document.removeEventListener('pointerdown',outside)}}document.addEventListener('pointerdown',outside)},0)}

)||'Singapore',category:cat||'Design',manual:!cat,url:'https://careers.nus.edu.sg/NUS/'};}if(!cats.includes(draft.category)){draft.category=cats[0];draft.manual=true}pluginStage='loading';render();setTimeout(()=>{pluginStage='ready';render()},1000)}if(a==='save-job'){captureDraft();if(!draft.title.trim()||!draft.company.trim())return toast('Add a position and company.');let existing=data.jobs.find(j=>j.company===draft.company&&j.title===draft.title);let j={...draft,id:existing?.id||Date.now(),status:existing?.status||'Saved',priority:pluginPriority,resume:$('#draft-resume').value,portfolio:$('#draft-portfolio').value};data.jobs=existing?data.jobs.map(old=>old.id===j.id?j:old):[j,...data.jobs];save();pluginStage='saved';render()}if(a==='workspace'){selected=null;location.hash='jobs';toast('Saved role is in your Workspace.')}if(a==='capture-again'){pluginStage='start';render()}if(a==='reset'){if(confirm('Reset this demo? Your browser-local notes and uploaded material names will be removed.')){profilePreviewId=null;destroyFilePreview();data=seed();normaliseData();currentInterviewId=data.interviews[0].id;eventTopics=[];eventSingapore=false;save();selected=null;pluginStage='start';prepStep='home';filters={Category:[],Location:[],Progress:[]};query='';render();toast('Demo reset')}}}

function renderChat(){let panel=$('#career-chat');if(!panel){panel=document.createElement('aside');panel.id='career-chat';panel.className='chat-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Career AI Chat');document.body.append(panel)}panel.innerHTML=`<div class="chat-heading"><div><h2>AI Chat</h2><small>Demo assistant · Guided replies</small></div><button class="close" id="close-chat" aria-label="Close AI Chat">×</button></div><div class="chat-body" id="chat-messages" role="log" aria-label="Conversation" aria-live="polite">${chatMessages.length?chatMessages.map(m=>`<div class="chat-message ${m.role}"><span class="label">${m.role==='user'?'You':'Career Space'}</span><p>${esc(m.text)}</p>${m.actions?`<div class="chat-actions">${m.actions.map(a=>a.go==='advisor'?`<a class="advisor-link" href="https://www.nus.edu.sg/cfg/students/career-ready/career-advisory" target="_blank" rel="noopener noreferrer">Speak to a NUS Career Advisor ↗</a>`:`<button data-chat-go="${a.go}">${a.label} →</button>`).join('')}</div>`:''}</div>`).join(''):`<div class="chat-empty"><span class="chat-spark" aria-hidden="true">✦</span><h3>What do you need?</h3><p class="muted">Jobs · Materials · Interview prep</p><div class="chat-suggestions">${chatSuggestions().map(q=>`<button data-chat-question="${q}">${q} ↗</button>`).join('')}</div></div>`}</div><form class="chat-compose" id="chat-form"><label for="chat-question" class="label">Your question</label><div class="chat-input-row"><textarea id="chat-question" name="question" rows="2" maxlength="1500" placeholder="Ask a question…" required>${esc(chatDraft)}</textarea><button class="primary" aria-label="Send question">↑</button></div><div class="row between"><small>No live AI or web search connected</small>${chatMessages.length?'<button class="quiet" type="button" id="clear-chat">Clear chat</button>':''}</div></form>`;$('#close-chat').onclick=()=>toggleChat(false);$('#chat-question').oninput=e=>chatDraft=e.target.value;$('#chat-form').onsubmit=e=>{e.preventDefault();sendChat($('#chat-question').value)};$('#chat-question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat(e.target.value)}};$('#clear-chat')?.addEventListener('click',()=>{chatMessages=[];chatDraft='';renderChat();$('#chat-question').focus()});panel.querySelectorAll('[data-chat-question]').forEach(b=>b.onclick=()=>sendChat(b.dataset.chatQuestion));panel.querySelectorAll('[data-chat-go]').forEach(b=>b.onclick=()=>{let go=b.dataset.chatGo;if(go==='prepare'){prepStep='choose';location.hash='interviews';render()}else if(go==='research'){prepStep='home';location.hash='interviews';render()}else location.hash=go;toggleChat(false)});let log=$('#chat-messages');log.scrollTop=log.scrollHeight}
function sendChat(raw){let text=raw.trim();if(!text)return;chatDraft='';let q=text.toLowerCase(),answer,actions=[];if(/advisor|human|person|人工|老师|顾问|签证|visa|salary|薪资|offer|不对|没帮助|不懂|cannot|can't|not helpful/.test(q)){answer='This needs individual advice. Speak to a NUS Career Advisor through the official appointment page.\nYour chat is not sent automatically. School sign-in may be required.';actions=[{label:'Speak to a NUS Career Advisor',go:'advisor'}]}else if(/resume|portfolio|material|简历|作品集|材料/.test(q)){let category=location.hash==='#interviews'?(data.jobs.find(j=>j.id===activeInterview().jobId)?.category||'Product'):selected?data.jobs.find(j=>j.id===selected)?.category:draft?.category||'Design',files=data.files.filter(f=>f.category===category);answer=`For ${category.toLowerCase()} roles, review these saved materials:\n${files.map(f=>'• '+f.name).join('\n')||'No matching files yet.'}\nThis demo matches by category. Confirm the content against the JD.`;actions=[{label:'Review profile',go:'profile'}]}else if(/experience|story|stories|经历|故事/.test(q)){answer='For collaboration questions: Getting a team unstuck.\nFor research or problem framing: Finding the real problem.\nChoose a story you can explain in your own words.';actions=[{label:'Choose experiences',go:'prepare'}]}else if(/vmock|practi[cs]|模拟|练习/.test(q)){answer='Use the VMock entry in Interviews for mock interview practice and detailed feedback. Career Space helps you choose stories, organise materials and reflect afterwards.';actions=[{label:'Open Interviews',go:'research'}]}else if(/interview|面试/.test(q)){answer=activeInterview().company+' · '+activeInterview().title+'\n'+activeInterview().date+' · '+activeInterview().time+' SGT\n\n1. Review possible questions.\n2. Choose relevant experiences.\n3. Confirm your resume and portfolio.\n4. Build a short outline.\nQuestion collection in this demo is simulated.';actions=[{label:'Review interview questions',go:'research'},{label:'Prepare materials',go:'prepare'}]}else if(/save|capture|plugin|保存|收集/.test(q)){answer='Plugin demo → Read this page → Review the category and recommended materials → Confirm files & save.\nThe saved role appears in Jobs. JD reading is simulated in this demo.';actions=[{label:'Open Plugin',go:'plugin'}]}else if(/today|task|next|今天|任务|下一步/.test(q)){let pending=[!data.tasks['resume-review']?'Resume review · Figma':null,!data.tasks['follow-up']?'Follow-up · Grab':null,data.reading&&!data.tasks['reading-action']?'Use one idea from your reading':null].filter(Boolean);answer=pending.length?'Your remaining actions:\n'+pending.map(t=>'□ '+t).join('\n'):'Your listed actions are complete. Review your interview materials when you are ready.';actions=[{label:'Open Today',go:'today'}]}else if(/job|role|filter|工作|职位|筛选/.test(q)){answer=`You have ${data.jobs.length} saved sample roles across ${cats.map(esc).join(', ')}. Use the visible filters for category, location and progress, then open a role in the right-side panel.`;actions=[{label:'Browse jobs',go:'jobs'}]}else if(/event|活动/.test(q)){answer=`You have ${data.savedEvents.length} saved sample events. Job Events includes portfolio clinics, career panels and networking. Dates and recommendations are illustrative.`;actions=[{label:'Browse events',go:'job-events'}]}else{answer='I cannot answer this reliably in the demo. A NUS Career Advisor can help with your specific situation.\nOpen the official page to request an appointment. Your conversation will not be sent automatically.';actions=[{label:'Speak to a NUS Career Advisor',go:'advisor'}]}chatMessages.push({role:'user',text},{role:'assistant',text:answer,actions});renderChat();$('#chat-question').focus()}

function formDialog(title,body,onSubmit){const dialog=document.createElement('dialog');dialog.setAttribute('aria-label',title);dialog.innerHTML=`<div class="row between"><h2>${title}</h2><button class="close" type="button" aria-label="Close dialog">×</button></div><form class="uploadform">${body}<p class="form-error" role="alert"></p><button class="primary" type="submit">Save</button></form>`;document.body.append(dialog);dialog.querySelector('.close').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const err=onSubmit(new FormData(e.target));if(err){dialog.querySelector('.form-error').textContent=err;return}dialog.close();save();render()};dialog.showModal();return dialog}
function categoryDialog(index){let old=cats[index];formDialog(old?'Rename category':'Add category',`<label class="field">Category name<input name="name" type="text" maxlength="36" value="${esc(old||'')}" required placeholder="e.g. Strategy"></label>`,form=>{let name=form.get('name').trim();if(!name)return 'Enter a category name.';if(cats.some((c,i)=>c.toLowerCase()===name.toLowerCase()&&i!==index))return 'That category already exists.';if(old){cats[index]=name;data.jobs.forEach(j=>{if(j.category===old)j.category=name});data.files.forEach(f=>{if(f.category===old)f.category=name});filters.Category=filters.Category.map(c=>c===old?name:c);if(draft?.category===old)draft.category=name}else cats.push(name);data.categories=[...cats];toast(old?'Category renamed':'Category added')})}
function moveJob(id,category){let j=data.jobs.find(j=>j.id===Number(id));if(!j||!cats.includes(category)||j.category===category)return;j.category=category;save();render();toast('Moved to '+category)}

function addInterview(){let dialog=formDialog('Add interview',`<label class="field">Link to a saved job (optional)<select name="jobId"><option value="">Enter manually</option>${data.jobs.map(j=>`<option value="${j.id}">${esc(j.company)} · ${esc(j.title)}</option>`).join('')}</select></label><div class="formgrid"><label class="field">Company<input type="text" name="company" maxlength="80" required></label><label class="field">Position<input type="text" name="title" maxlength="120" required></label><label class="field">Date<input type="date" name="date" required></label><label class="field">Time · SGT<input type="time" name="time" required></label><label class="field">Location / meeting details<input type="text" name="location" placeholder="Online / campus / office" maxlength="160" required></label><label class="field">Round<input type="text" name="round" value="Round 1" maxlength="60" required></label></div><small>Saved in this browser. No invitations are sent.</small>`,form=>{const values=Object.fromEntries(form);for(const k of ['company','title','date','time','location','round'])if(!values[k].trim())return 'Complete all required fields.';let jobId=Number(values.jobId)||null,it={...values,jobId,id:'interview-'+Date.now(),company:values.company.trim(),title:values.title.trim(),stories:[],researchState:'idle',outline:false,reflection:null};data.interviews.push(it);currentInterviewId=it.id;prepStep='home';let j=data.jobs.find(j=>j.id===jobId);if(j)j.status='Interview';toast('Interview added')});dialog.querySelector('[name=jobId]').onchange=e=>{let j=data.jobs.find(j=>j.id===Number(e.target.value));if(j){dialog.querySelector('[name=company]').value=j.company;dialog.querySelector('[name=title]').value=j.title}}}
function localFileStore(mode,key,file){return new Promise((resolve,reject)=>{let request=indexedDB.open('nus-career-local-files',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onerror=()=>reject(request.error);request.onsuccess=()=>{let db=request.result,tx=db.transaction('files',mode==='put'?'readwrite':'readonly'),store=tx.objectStore('files'),op=mode==='put'?store.put(file,key):store.get(key);op.onerror=()=>{db.close();reject(op.error)};tx.oncomplete=()=>{let result=op.result;db.close();resolve(result)};tx.onerror=()=>{db.close();reject(tx.error)}}})}
function destroyFilePreview(){document.querySelector('.file-preview-panel')?.remove();if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null}}

function sampleResume(f){if(f.type==='Portfolio')return `<article class="resume-paper"><div class="resume-sample-label">SAMPLE PORTFOLIO · DEMO CONTENT</div><h2>Selected work</h2><p class="resume-subtitle">${esc(f.name)}</p><hr><h3>User research & problem framing</h3><p>Example case study · Understand the context, synthesise observations and define the problem.</p><div class="portfolio-placeholder">Research notes → Insights → Design direction</div><h3>Interaction design</h3><p>Example case study · Explore a flow, prototype it and use feedback to guide the next iteration.</p><div class="portfolio-placeholder">Sketch → Prototype → Iterate</div><footer>Illustrative portfolio layout, not a personal project document</footer></article>`;let research=/research/i.test(f.name),product=/product/i.test(f.name),focus=research?'UX Research':product?'Product Management':'Product & Interaction Design';return `<article class="resume-paper" aria-label="Sample resume page"><div class="resume-sample-label">SAMPLE RESUME · DEMO CONTENT</div><h2>Zi Yean</h2><p class="resume-subtitle">${focus} · Singapore</p><hr><h3>Profile</h3><p>NUS student exploring ${focus.toLowerCase()}. Interested in turning research into clear, useful product experiences.</p><h3>Education</h3><div class="resume-item"><b>National University of Singapore</b><span>Current student · Demonstration profile</span></div><h3>Selected experience</h3><div class="resume-item"><b>${research?'User research & problem framing':product?'Product decisions & collaboration':'Interaction design project'}</b><span>Course project · Example experience</span><ul><li>${research?'Explored user needs through interviews and synthesis.':product?'Helped the team clarify priorities and compare possible directions.':'Explored a user problem through sketches and interaction prototypes.'}</li><li>${research?'Translated patterns into a clearer problem definition.':product?'Connected user feedback with decisions about the next iteration.':'Used feedback to revise the flow and explain design choices.'}</li></ul></div><div class="resume-item"><b>Team collaboration project</b><span>Course project · Example experience</span><ul><li>Clarified responsibilities and helped move a shared decision forward.</li><li>Documented the process and reflected on the next improvement.</li></ul></div><h3>Skills</h3><p>${research?'Interview planning · Research synthesis · Usability testing':product?'Problem framing · Prioritisation · Stakeholder communication':'Interaction design · Prototyping · User research · Figma'}</p><footer>${esc(f.name)} · Illustrative layout, not a verified personal resume</footer></article>`}
async function renderFilePreview(){destroyFilePreview();let f=data.files.find(f=>f.id===profilePreviewId);if(!f)return;let panel=document.createElement('aside');panel.className='file-preview-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Material preview');panel.innerHTML=`<div class="file-preview-header"><div><small>${esc(f.type)} / ${esc(f.category)}</small><h2>${esc(f.name)}</h2></div><button class="close" aria-label="Close material preview">×</button></div><div class="file-preview-body">${f.uploaded?'<div class="preview-loading">Opening local file…</div>':sampleResume(f)}</div>`;document.body.append(panel);panel.querySelector('.close').onclick=closeFilePreview;panel.querySelector('.close').focus();if(!f.uploaded)return;try{let file=f.hasBlob?await localFileStore('get',f.id):null;if(!panel.isConnected||profilePreviewId!==f.id)return;let body=panel.querySelector('.file-preview-body');if(!file){body.innerHTML=`<div class="preview-empty"><h3>Choose this file to preview it</h3><p class="muted">${esc(f.filename||f.name)}</p><small>This older entry saved the file name only. Select the original file once to enable browser-local preview.</small><label class="field sectiongap">Original file<input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg" id="restore-preview-file"></label></div>`;body.querySelector('input').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{await localFileStore('put',f.id,file);f.hasBlob=true;f.filename=file.name;f.mime=file.type;save();renderFilePreview()}catch{toast('File storage is unavailable in this browser')}};return}previewObjectUrl=URL.createObjectURL(file);let isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name),isImage=/^image\/(png|jpeg|webp)$/.test(file.type);body.innerHTML=`<div class="local-file-note"><span class="pill attention">LOCAL FILE</span><small>Only stored in this browser</small><a href="${previewObjectUrl}" download="${esc(file.name)}">Download ↗</a></div>${isPdf?`<iframe class="pdf-preview" src="${previewObjectUrl}" title="${esc(f.name)} PDF preview"></iframe>`:isImage?`<img class="image-preview" src="${previewObjectUrl}" alt="${esc(f.name)}">`:`<div class="preview-empty"><h3>Preview unavailable for this format</h3><p>${esc(file.name)}</p><p class="muted">Use a PDF or image for an inline preview, or download to open the original file.</p></div>`}`}catch{if(panel.isConnected)panel.querySelector('.file-preview-body').innerHTML='<div class="preview-empty">Cannot open browser-local file storage.</div>'}}
